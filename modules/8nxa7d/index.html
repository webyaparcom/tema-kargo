  .modulex-iletisim-sohbet :where(ul, ol) { padding: 0; list-style: none; }
  .modulex-iletisim-sohbet img { display: block; max-width: 100%; }

  .modulex-iletisim-sohbet-akis { display: grid; gap: 10px; padding: 22px 18px 26px; background: color-mix(in srgb, --accent-- 5%, --bg--); }
  .modulex-iletisim-sohbet-etk { justify-self: center; padding: 4px 12px; border-radius: 999px; background: --kartBg--; color: --muted--; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
  .modulex-iletisim-sohbet-balon { justify-self: start; max-width: 88%; padding: 12px 16px; border-radius: 18px; border-end-start-radius: 4px; background: --kartBg--; animation: modulex-iletisim-sohbet-gel 0.5s ease both; }
  .modulex-iletisim-sohbet-balon .modulex-iletisim-sohbet-baslik { font-size: clamp(1.25rem, 2.4vw, 1.6rem); }
  .modulex-iletisim-sohbet-balon .modulex-iletisim-sohbet-metin { color: inherit; font-size: 1rem; }
  .modulex-iletisim-sohbet-yaziyor { display: inline-flex; gap: 4px; justify-self: start; padding: 10px 14px; border-radius: 16px; background: --kartBg--; }

  .modulex-iletisim-sohbet-yaziyor i:nth-child(2) { animation-delay: 0.15s; }
  .modulex-iletisim-sohbet-yaziyor i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes modulex-iletisim-sohbet-nokta { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-4px); opacity: 1; } }
  @keyframes modulex-iletisim-sohbet-gel { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .modulex-iletisim-sohbet-yanitlar { display: grid; gap: 8px; justify-items: end; margin-block-start: 6px; }
  .modulex-iletisim-sohbet-yanit { display: flex; align-items: center; gap: 10px; max-width: 92%; padding: 10px 14px; border-radius: 18px; border-end-end-radius: 4px; background: --vurguBg--; color: --vurguText--; transition: transform 0.25s ease, opacity 0.4s ease; }
  .modulex-iletisim-sohbet-yanit:hover { transform: translateX(-4px); }
  .modulex-iletisim-sohbet-yanit .modulex-iletisim-sohbet-ketiket { color: inherit; opacity: 1; font-size: 0.72rem; }
  .modulex-iletisim-sohbet-yikon { font-size: 22px; }
  .modulex-iletisim-sohbet-ygovde { display: grid; min-width: 0; }
  .modulex-iletisim-sohbet--hazir:not(.modulex-iletisim-sohbet--gor) .modulex-iletisim-sohbet-yanit { opacity: 0; }
  .modulex-iletisim-sohbet--gor .modulex-iletisim-sohbet-yanit { transition-delay: calc(0.3s + var(--i, 0) * 120ms); }
  @media (max-width: 768px) {
    .modulex-iletisim-sohbet-ekran { border-radius: 22px; }
    .modulex-iletisim-sohbet-akis { padding: 18px 12px 22px; }
  }
  .modulex-iletisim-sohbet-kikon { flex: none; display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: 14px; background: color-mix(in srgb, --accent-- 14%, transparent); color: --accentInk--; font-size: 24px; }
  .modulex-iletisim-sohbet-ketiket { display: block; color: --muted--; font-size: 0.82rem; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; }
  .modulex-iletisim-sohbet-deger { color: inherit; font-weight: 650; text-decoration: none; overflow-wrap: anywhere; transition: color 0.2s ease; }
  a.modulex-iletisim-sohbet-deger:hover { color: --accentInk--; text-decoration: underline; text-underline-offset: 4px; }
  .modulex-iletisim-sohbet-eylem { display: inline-flex; align-items: center; gap: 6px; color: --accentInk--; font-weight: 700; text-decoration: none; transition: gap 0.2s ease; }
  .modulex-iletisim-sohbet-eylem:hover { gap: 10px; }
  .modulex-iletisim-sohbet-eylem .material-symbols-outlined { font-size: 18px; }
  .modulex-iletisim-sohbet-kopya { display: none; align-items: center; gap: 6px; min-height: 36px; padding: 6px 12px; border: 1px solid --cizgi--; border-radius: 999px; background: transparent; color: --text--; font: inherit; font-size: 0.85rem; font-weight: 650; transition: border-color 0.2s ease, background 0.2s ease; }
  .modulex-iletisim-sohbet--kjs .modulex-iletisim-sohbet-kopya { display: inline-flex; }
  .modulex-iletisim-sohbet-kopya:hover { border-color: --accent--; }
  .modulex-iletisim-sohbet-kopya .material-symbols-outlined { font-size: 18px; }
  .modulex-iletisim-sohbet--kopyalandi { background: color-mix(in srgb, --accent-- 14%, transparent); }
  .modulex-iletisim-sohbet-sosyal { display: grid; gap: 10px; }
  .modulex-iletisim-sohbet-sbaslik { color: --muted--; font-size: 0.9rem; font-weight: 650; }
  .modulex-iletisim-sohbet-sliste { display: flex; flex-wrap: wrap; gap: 8px; }
  .modulex-iletisim-sohbet-cip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 8px 14px; border: 1px solid --cizgi--; border-radius: 999px; color: inherit; font-weight: 650; text-decoration: none; transition: border-color 0.2s ease, transform 0.2s ease; }
  .modulex-iletisim-sohbet-cip:hover { border-color: --accent--; transform: translateY(-2px); }
  .modulex-iletisim-sohbet-cikon { font-size: 18px; }
  .modulex-iletisim-sohbet-harita { position: relative; overflow: hidden; min-height: 280px; border-radius: --yuvarlak--; background: --kartBg--; }
  .modulex-iletisim-sohbet-iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .modulex-iletisim-sohbet-hdesen { position: absolute; inset: 0; display: grid; place-items: center; background-color: color-mix(in srgb, --accent-- 8%, --kartBg--); background-image: linear-gradient(color-mix(in srgb, --text-- 7%, transparent) 1px, transparent 1px), linear-gradient(90deg, color-mix(in srgb, --text-- 7%, transparent) 1px, transparent 1px), radial-gradient(circle at 30% 40%, color-mix(in srgb, --accent-- 18%, transparent) 0 18%, transparent 19%); background-size: 36px 36px, 36px 36px, 100% 100%; }
  .modulex-iletisim-sohbet-pin { color: --accentInk--; font-size: 56px; animation: modulex-iletisim-sohbet-zipla 2.4s ease-in-out infinite; }
  @keyframes modulex-iletisim-sohbet-zipla { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .modulex-iletisim-sohbet-hyol { position: absolute; inset-block-end: 16px; inset-inline-start: 16px; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 10px 16px; border-radius: 999px; background: --bg--; color: --text--; font-weight: 700; text-decoration: none; box-shadow: 0 6px 20px color-mix(in srgb, --text-- 16%, transparent); transition: transform 0.2s ease; }
  .modulex-iletisim-sohbet-hyol:hover { transform: translateY(-2px); }
  .modulex-iletisim-sohbet-hyol .material-symbols-outlined { font-size: 18px; color: --accentInk--; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-iletisim-sohbet :is(.modulex-iletisim-sohbet-baslik, .modulex-iletisim-sohbet-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-iletisim-sohbet-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-iletisim-sohbet { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-iletisim-sohbet *, .modulex-iletisim-sohbet *::before, .modulex-iletisim-sohbet *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-iletisim-sohbet";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gozlem = (s, P, az) => {
        const gor = () => s.classList.add(P + "--gor");
        s.classList.add(P + "--hazir");
        if (az || !("IntersectionObserver" in window)) { gor(); return; }
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { gor(); io.disconnect(); } });
        }, { threshold: 0.15 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gozlem(s, P, az);
    });
  })();
</script>
